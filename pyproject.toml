[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "us-stock-helper"
version = "0.1.0"
description = "Traceable, no-lookahead indicators for an event-driven US stock helper."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

