[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-stock-helper-device-auth"
version = "0.1.0"
description = "Device pairing and revocable device tokens for public-internet access"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
us-stock-helper-device-auth = "us_stock_helper_device_auth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["us_stock_helper_device_auth*"]

[tool.setuptools.package-data]
us_stock_helper_device_auth = ["py.typed"]
